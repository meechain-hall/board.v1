name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  # Allows the production-only jobs below to be started from the Actions UI
  # after selecting the protected main branch.
  workflow_dispatch:

# Prevent multiple CI runs for the same branch/PR from competing.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://api.meechain.live' }}
  NEXT_PUBLIC_RPC_URL: ${{ secrets.NEXT_PUBLIC_RPC_URL || 'https://rpc.meechain.live' }}
  NEXT_PUBLIC_CHAIN_ID: ${{ secrets.NEXT_PUBLIC_CHAIN_ID || '13390' }}

permissions:
  contents: read

jobs:

  # ============================================================
  # 1. LINT & TYPECHECK
  # ============================================================
  lint-and-typecheck:
    runs-on: ubuntu-latest
    name: Lint & Type Check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
       
      - name: Run ESLint
        run: pnpm run lint

      - name: Run TypeScript check
        run: pnpm run typecheck


  # ============================================================
  # 2. BUILD NEXT.JS
  # ============================================================
  build:
    runs-on: ubuntu-latest
    name: Build Next.js
    needs: lint-and-typecheck

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify environment
        run: |
          echo "Node: $(node --version)"
          echo "pnpm:  $(pnpm --version)"
          echo "NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}"
          echo "NEXT_PUBLIC_RPC_URL: ${NEXT_PUBLIC_RPC_URL}"
          echo "NEXT_PUBLIC_CHAIN_ID: ${NEXT_PUBLIC_CHAIN_ID}"

      - name: Build Next.js
        run: pnpm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ env.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_RPC_URL: ${{ env.NEXT_PUBLIC_RPC_URL }}
          NEXT_PUBLIC_CHAIN_ID: ${{ env.NEXT_PUBLIC_CHAIN_ID }}

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next
          retention-days: 7


  # ============================================================
  # 3. SECURITY SCAN
  # ============================================================
  security:
    runs-on: ubuntu-latest
    name: Security Scan
    needs: lint-and-typecheck
    permissions:
      contents: read
      security-events: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Do not hide pnpm audit failures.
      - name: Run pnpm audit
        run: pnpm audit --audit-level=moderate

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true

      - name: Upload Trivy results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif


  # ============================================================
  # 4. E2E VERIFICATION
  # ============================================================
  #
  # Intentionally NOT part of the production deployment gate yet. These jobs
  # remain skipped until Playwright/Cypress configuration and test coverage exist.
  #
  # Playwright/Cypress should only become a required gate after
  # the project has real configuration and test coverage.
  #
  e2e-playwright:
    runs-on: ubuntu-latest
    name: E2E Tests (Playwright)
    needs: build
    if: false

    steps:
      - run: echo "Playwright verification is not configured yet."


  e2e-cypress:
    runs-on: ubuntu-latest
    name: E2E Tests (Cypress)
    needs: build
    if: false

    steps:
      - run: echo "Cypress verification is not configured yet."


  # ============================================================
  # 5. DEPLOY TO VERCEL
  # ============================================================
  deploy-vercel:
    runs-on: ubuntu-latest
    name: Deploy to Vercel
    needs:
      - build
      - security
    if: >
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # เอา full history เผื่อ Vercel CLI ต้องใช้ git metadata

      - name: Verify Vercel secrets are configured
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=0
          [ -z "$VERCEL_TOKEN" ] && { echo "::error::VERCEL_TOKEN secret ไม่ได้ตั้งค่า"; missing=1; }
          [ -z "$VERCEL_ORG_ID" ] && { echo "::error::VERCEL_ORG_ID secret ไม่ได้ตั้งค่า"; missing=1; }
          [ -z "$VERCEL_PROJECT_ID" ] && { echo "::error::VERCEL_PROJECT_ID secret ไม่ได้ตั้งค่า"; missing=1; }
          if [ "$missing" -eq 1 ]; then
            echo "::error::ไปตั้งค่าที่ Settings → Secrets and variables → Actions ก่อน"
            exit 1
          fi
          echo "✓ Vercel secrets ครบทั้ง 3 ตัว"

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

        run: |
          npx --yes vercel@latest deploy --prod --yes \
            --token "$VERCEL_TOKEN" \
            --scope "$VERCEL_ORG_ID" \
            --project "$VERCEL_PROJECT_ID" \
            --meta githubCommitSha="${{ github.sha }}" \
            --meta githubCommitRef="${{ github.ref_name }}" \
            --build-env "NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}" \
            --build-env "NEXT_PUBLIC_RPC_URL=${NEXT_PUBLIC_RPC_URL}" \
            --build-env "NEXT_PUBLIC_CHAIN_ID=${NEXT_PUBLIC_CHAIN_ID}" \
            --env "NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}" \
            --env "NEXT_PUBLIC_RPC_URL=${NEXT_PUBLIC_RPC_URL}" \
            --env "NEXT_PUBLIC_CHAIN_ID=${NEXT_PUBLIC_CHAIN_ID}"

      - name: Deployment summary
        run: |
          echo "=========================================="
          echo " MeeChain Production Deployment"
          echo "=========================================="
          echo "Branch : ${GITHUB_REF_NAME}"
          echo "Commit : ${GITHUB_SHA}"
          echo "Chain  : ${NEXT_PUBLIC_CHAIN_ID}"
          echo "API    : ${NEXT_PUBLIC_API_URL}"
          echo "RPC    : ${NEXT_PUBLIC_RPC_URL}"
          echo "Status : DEPLOYED"
          echo "=========================================="

  # ============================================================
  # 6. DEPLOYMENT VERIFICATION
  # ============================================================
  #
  # Lightweight post-deployment verification.
  # This does not replace the Production Code Hub.
  #
  production-verify:
    runs-on: ubuntu-latest
    name: Production Verification
    needs: deploy-vercel

    if: >
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'

    steps:
      - name: Verify production API
        run: |
          echo "Checking production health endpoint..."

          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 20 \
            https://board.meechain.live/api/health

          echo
          echo "Production health check passed."

      - name: Verify RPC endpoint
        run: |
          echo "Checking MeeChain RPC..."

          RESPONSE=$(curl \
            --fail \
            --silent \
            --show-error \
            --max-time 20 \
            -X POST \
            -H "Content-Type: application/json" \
            --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' \
            https://rpc.meechain.live)

          echo "$RESPONSE"

          echo "$RESPONSE" | grep -q '"0x344e"' || {
            echo "ERROR: RPC returned unexpected chain ID."
            exit 1
          }

          echo "RPC chain ID verification passed."


  # ============================================================
  # 7. PLACEHOLDER FOR FUTURE PERFORMANCE VERIFICATION
  # ============================================================
  #
  # Not executed yet.
  #
  performance:
    runs-on: ubuntu-latest
    name: Performance Verification
    if: false

    steps:
      - run: echo "Performance verification is not configured yet."
