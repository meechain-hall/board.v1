name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

# Prevent multiple CI runs for the same branch/PR from competing.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://api.meechain.live' }}
  NEXT_PUBLIC_RPC_URL: ${{ secrets.NEXT_PUBLIC_RPC_URL || 'https://rpc.meechain.live' }}
  NEXT_PUBLIC_CHAIN_ID: ${{ secrets.NEXT_PUBLIC_CHAIN_ID || '13390' }}

permissions:
  contents: read

jobs:

  # ============================================================
  # 1. LINT & TYPECHECK
  # ============================================================
  lint-and-typecheck:
    runs-on: ubuntu-latest
    name: Lint & Type Check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check
        run: npm run typecheck


  # ============================================================
  # 2. BUILD NEXT.JS
  # ============================================================
  build:
    runs-on: ubuntu-latest
    name: Build Next.js
    needs: lint-and-typecheck

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify environment
        run: |
          echo "Node: $(node --version)"
          echo "npm:  $(npm --version)"
          echo "NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}"
          echo "NEXT_PUBLIC_RPC_URL: ${NEXT_PUBLIC_RPC_URL}"
          echo "NEXT_PUBLIC_CHAIN_ID: ${NEXT_PUBLIC_CHAIN_ID}"

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ env.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_RPC_URL: ${{ env.NEXT_PUBLIC_RPC_URL }}
          NEXT_PUBLIC_CHAIN_ID: ${{ env.NEXT_PUBLIC_CHAIN_ID }}

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next
          retention-days: 7


  # ============================================================
  # 3. SECURITY SCAN
  # ============================================================
  security:
    runs-on: ubuntu-latest
    name: Security Scan
    needs: lint-and-typecheck

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Do not hide npm audit failures.
      - name: Run npm audit
        run: npm audit --audit-level=moderate

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true

      - name: Upload Trivy results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif


  # ============================================================
  # 4. E2E VERIFICATION
  # ============================================================
  #
  # Intentionally NOT part of the production deployment gate yet.
  #
  # Playwright/Cypress should only become a required gate after
  # the project has real configuration and test coverage.
  #
  e2e-playwright:
    runs-on: ubuntu-latest
    name: E2E Tests (Playwright)
    needs: build
    if: false

    steps:
      - run: echo "Playwright verification is not configured yet."


  e2e-cypress:
    runs-on: ubuntu-latest
    name: E2E Tests (Cypress)
    needs: build
    if: false

    steps:
      - run: echo "Cypress verification is not configured yet."


  # ============================================================
  # 5. DEPLOY TO VERCEL
  # ============================================================
  deploy-vercel:
    runs-on: ubuntu-latest
    name: Deploy to Vercel

    # Production deployment only depends on real verification.
    needs:
      - build
      - security

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: vercel/action@v4
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          production: true
          environment-variables: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_RPC_URL=${{ env.NEXT_PUBLIC_RPC_URL }}
            NEXT_PUBLIC_CHAIN_ID=${{ env.NEXT_PUBLIC_CHAIN_ID }}

      - name: Deployment summary
        run: |
          echo "=========================================="
          echo " MeeChain Production Deployment"
          echo "=========================================="
          echo "Branch : ${GITHUB_REF_NAME}"
          echo "Commit : ${GITHUB_SHA}"
          echo "Chain  : ${NEXT_PUBLIC_CHAIN_ID}"
          echo "API    : ${NEXT_PUBLIC_API_URL}"
          echo "RPC    : ${NEXT_PUBLIC_RPC_URL}"
          echo "Status : DEPLOYED"
          echo "=========================================="


  # ============================================================
  # 6. DEPLOYMENT VERIFICATION
  # ============================================================
  #
  # Lightweight post-deployment verification.
  # This does not replace the Production Code Hub.
  #
  production-verify:
    runs-on: ubuntu-latest
    name: Production Verification
    needs: deploy-vercel

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    steps:
      - name: Verify production API
        run: |
          echo "Checking production health endpoint..."

          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 20 \
            https://board.meechain.live/api/health

          echo
          echo "Production health check passed."

      - name: Verify RPC endpoint
        run: |
          echo "Checking MeeChain RPC..."

          RESPONSE=$(curl \
            --fail \
            --silent \
            --show-error \
            --max-time 20 \
            -X POST \
            -H "Content-Type: application/json" \
            --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' \
            https://rpc.meechain.live)

          echo "$RESPONSE"

          echo "$RESPONSE" | grep -q '"0x344e"' || {
            echo "ERROR: RPC returned unexpected chain ID."
            exit 1
          }

          echo "RPC chain ID verification passed."


  # ============================================================
  # 7. PLACEHOLDER FOR FUTURE PERFORMANCE VERIFICATION
  # ============================================================
  #
  # Not executed yet.
  #
  performance:
    runs-on: ubuntu-latest
    name: Performance Verification
    if: true

    steps:
      - run: echo "Performance verification is not configured yet."
