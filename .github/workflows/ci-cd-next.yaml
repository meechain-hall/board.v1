name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

# Prevent multiple CI runs for the same branch/PR from competing.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://api.meechain.live' }}
  NEXT_PUBLIC_RPC_URL: ${{ secrets.NEXT_PUBLIC_RPC_URL || 'https://rpc.meechain.live' }}
  NEXT_PUBLIC_CHAIN_ID: ${{ secrets.NEXT_PUBLIC_CHAIN_ID || '13390' }}

permissions:
  contents: read

jobs:
    
# 1. LINT & TYPECHECK===========

  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

#============================================================

#2. BUILD NEXT.JS

#============================================================
  build-next:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

#============================================================

#3. DEPLOY SUPABASE FUNCTIONS

#============================================================
  deploy-supabase:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - name: Setup Supabase CLI
        run: |
          curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
          npm install -g supabase
      - name: Deploy relay-packet function
        run: supabase functions deploy relay-packet
        env:
          SUPABASEACCESSTOKEN: ${{ secrets.SUPABASEACCESSTOKEN }}

#============================================================

#4. DEPLOY TO VERCEL

#============================================================
  deploy-vercel:
    runs-on: ubuntu-latest
    needs: [build-next, deploy-supabase]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel
        uses: vercel/action@v4
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCELORGID }}
          vercel-project-id: ${{ secrets.VERCELPROJECTID }}
          production: true